<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社保成本测算看板</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--primary:#1e3a8a;--primary-light:#eef1fb;--accent:#2563eb;--text:#1f2937;--text2:#6b7280;--border:#e5e7eb;--green:#059669;--red:#dc2626;--row-alt:#f9fafb;--shadow:none}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:12px;line-height:1.4}

.topbar{background:var(--card);border-bottom:1px dotted var(--border);padding:4px 12px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar h1{font-size:16px;font-weight:700;color:var(--primary);white-space:nowrap}
.slider-box{display:flex;align-items:center;gap:12px;flex:1;max-width:480px}
.slider-box label{font-size:12px;color:var(--text2);white-space:nowrap;font-weight:500}
.slider-box input[type=range]{flex:1;height:5px;-webkit-appearance:none;background:#ddd;border-radius:3px;outline:none;cursor:pointer}
.slider-box input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pct-show{font-size:18px;font-weight:800;color:var(--accent);min-width:48px;text-align:center}
.quick-btns{display:flex;gap:4px}
.qb{padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;background:#f3f4f6;border:1px solid var(--border);font-weight:500;transition:all .15s}
.qb:hover{background:#e5e7eb}
.qb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar .info{font-size:11px;color:var(--text2);margin-left:auto;white-space:nowrap}

.wrap{padding:4px 10px;display:flex;flex-direction:column;align-items:center}
.title-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:8px;width:100%}
.notify-info{margin-right:auto;font-size:12px;line-height:1.4;color:#1f2937;background:#eef2ff;border-radius:4px;padding:2px 10px}
.notify-info span{display:block;font-weight:500}
.notify-info b{color:#1e3a8a;font-weight:700}
.title-row h2{font-size:13px;font-weight:700;color:var(--primary)}
.summary-cards{display:flex;gap:6px}
.sc{background:#fff;border-radius:6px;padding:8px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;min-width:160px;border-left:3px solid #ccc}
.sc .sl{font-size:11px;color:#6b7280;margin-bottom:2px}
.sc .sv{font-size:20px;font-weight:800;margin-top:2px}
.sc .sv.up{color:var(--red)}.sc .sv.down{color:var(--green)}

.tbl-wrap{background:var(--card);border-radius:8px;box-shadow:var(--shadow);overflow-x:auto;width:100%}
table{border-collapse:collapse;margin:0 auto}
thead th{background:var(--primary);color:#fff;padding:2px 3px;font-size:11px;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap;position:sticky;top:0}
thead th:first-child{text-align:center;width:28px}
thead th:last-child{border-right:none}
tbody td{padding:1px 3px;text-align:center;border-bottom:1px dotted var(--border);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:nth-child(2){text-align:left}

.city-row{cursor:pointer}
.city-row td{font-weight:600;background:#fff;padding:1px 3px}
.city-row:nth-child(4n+1) td{background:var(--row-alt)}
.city-row:hover td{background:#e8edfb!important}
.city-row .arrow{display:inline-block;width:12px;text-align:center;transition:transform .2s;font-size:10px;color:var(--text2);margin-right:2px}
.city-row.open .arrow{transform:rotate(90deg)}
.ent-row{display:none}
.ent-row.show{display:table-row}
.ent-row td{padding:1px 3px;font-size:12px;color:#555;background:#fafbfe}
.ent-row td:nth-child(2){padding-left:10px}
.ent-row:hover td{background:#eef1fb!important}
.total-row td{font-weight:700;background:#e8edfb!important;border-top:2px solid var(--primary);font-size:12px;padding:1px 3px}

.ratio-input{width:30px;padding:0;border:1px solid #d1d5db;border-radius:3px;text-align:center;font-size:11px;font-weight:600;color:var(--accent);background:#f8faff;line-height:1.2}
.ratio-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.rate-cell{font-weight:600}
.rate-hi{color:var(--green)}
.rate-mid{color:#d97706}
.rate-lo{color:var(--red)}
.chg-up{color:var(--red);font-weight:600}
.chg-down{color:var(--green);font-weight:600}
.num-warn{color:var(--red);font-weight:600}
.grp-before{background:#2d4a9e!important}
.grp-after{background:#1a6b3c!important}
thead th{padding:2px 3px;font-size:11px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#2a4faf!important;opacity:.9}
.sa{font-size:9px;margin-left:1px;opacity:.7}
tbody td{padding:1px 3px;font-size:12px;text-align:center;white-space:nowrap}
.ratio-input{width:30px;padding:0;font-size:11px;line-height:1.2}
.city-row td,.ent-row td{font-size:12px}
</style>
</head>

function V(v){return(v==null||v!==v)?0:v}
function clamp(base, lo, hi) { return Math.max(lo, Math.min(hi, base)); }
function calcCost(recs, pct, city) {
  const lim = LIMITS[city] || [0, 999999];
  const lo = lim[0], hi = lim[1];
  let pp=0,pc=0,mp=0,mc=0,ic=0,up=0,uc=0,mtc=0;
  for (const r of recs) {
    if (pct === null) {
      pp+=V(r.pp);pc+=V(r.pc);mp+=V(r.mp);mc+=V(r.mc);ic+=V(r.ic);up+=V(r.up);uc+=V(r.uc);mtc+=V(r.mtc);
    } else {
      const s = V(r.s);
      if (s <= 0) continue;
      const rawS = s * (pct/100);
      const pb=clamp(rawS,lo,hi), mb=clamp(rawS,lo,hi), ib=clamp(rawS,lo,hi);
      const ub=clamp(rawS,lo,hi), mtb=clamp(rawS,lo,hi);
      pp+=pb*V(r.prp);pc+=pb*V(r.prc);mp+=mb*V(r.mrp);mc+=mb*V(r.mrc);ic+=ib*V(r.ir);
      up+=ub*V(r.urp);uc+=ub*V(r.urc);mtc+=mtb*V(r.mtr);
    }
  }
  return {pp,pc,mp,mc,ic,up,uc,mtc,per:pp+mp+up,com:pc+mc+ic+uc+mtc};
}

function f(n){return (n*12/10000).toFixed(2)}
function fp(n){return Math.round(n*12).toLocaleString('zh-CN')}
function fc(n){return Math.round(n*12/10000).toLocaleString('zh-CN')}
function fi(n){return Math.round(n||0).toLocaleString('zh-CN')}
function rateClass(r){return r>=70?'rate-cell rate-hi':r>=40?'rate-cell rate-mid':'rate-cell rate-lo'}

// Per-city ratios only
const openCities = new Set();

function getEffPct(city) {
  return cityRatios[city] !== null ? cityRatios[city] : 100;
}

let sortCol = 4, sortDir = -1; // default: sort by 在保人数 desc

function sortBy(col) {
  if (sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = 1; }
  // Update sort arrows
  document.querySelectorAll('.sa').forEach(el => el.textContent = '');
  const sa = document.getElementById('sa' + col);
  if (sa) sa.textContent = sortDir === 1 ? ' ▲' : ' ▼';
  render();
}

function render() {
  const tbody = document.getElementById('tblBody');
  let h = '';
  let grandN=0, grandCurPer=0, grandCurCom=0, grandNewPer=0, grandNewCom=0;

  // Pre-compute city metrics for sorting
  const cityMetrics = [];
  for (let i = 0; i < CITIES.length; i++) {
    const city = CITIES[i];
    const ents = Object.keys(DATA[city]);
    const allRecs = [];
    for (const e of ents) allRecs.push(...DATA[city][e]);
    const n = allRecs.length;
    const avgSal = allRecs.reduce((s,r)=>s+V(r.s),0)/n;
    const avgBase = allRecs.reduce((s,r)=>s+V(r.pb),0)/n;
    const rate = avgSal>0 ? (avgBase/avgSal*100) : 0;
    const cur = calcCost(allRecs, null, city);
    const effPct = getEffPct(city);
    const adj = calcCost(allRecs, effPct, city);
    const chg = (adj.per+adj.com) - (cur.per+cur.com);

    grandN+=n; grandCurPer+=cur.per; grandCurCom+=cur.com;
    grandNewPer+=adj.per; grandNewCom+=adj.com;

    cityMetrics.push({idx:i, city, n, avgSal, avgBase, rate, cur, adj, chg, effPct, ents});
  }

  // Sort if needed
  if (sortCol >= 0) {
    const getters = [
      m => m.idx,           // 0: 序号
      m => m.city,          // 1: 城市
      m => (LIMITS[m.city]||[0,0])[0], // 2: 下限
      m => (LIMITS[m.city]||[0,0])[1], // 3: 上限
      m => m.n,             // 4: 人数
      m => m.avgSal,        // 5: 月均工资
      m => m.avgBase,       // 6: 月均基数
      m => m.rate,          // 7: 当前缴纳比例
      m => m.cur.per,       // 8: 调整前-个人
      m => m.cur.com,       // 9: 调整前-公司
      m => m.adj.per,       // 10: 调整后-个人
      m => m.adj.com,       // 11: 调整后-公司
      m => m.chg            // 12: 成本变化
    ];
    const fn = getters[sortCol];
    cityMetrics.sort((a, b) => {
      const va = fn(a), vb = fn(b);
      if (typeof va === 'string') return sortDir * va.localeCompare(vb, 'zh-CN');
      return sortDir * (va - vb);
    });
  }

  // Render rows
  for (let si = 0; si < cityMetrics.length; si++) {
    const m = cityMetrics[si];
    const {city, n, avgSal, avgBase, rate, cur, adj, chg, effPct, ents} = m;
    const i = m.idx;
    const isOpen = openCities.has(city);
    const ratioVal = cityRatios[city] !== null ? cityRatios[city] : '';

    h += '<tr class="city-row'+(isOpen?' open':'')+'" onclick="toggleCity(\''+city.replace(/'/g,"\\'")+'\')" data-city="'+i+'">';
    h += '<td>'+(si+1)+'</td>';
    const lim=LIMITS[city]||[0,0];
    h += '<td><span class="arrow">'+(isOpen?'▼':'▶')+'</span>'+city+'</td>';
    h += '<td>'+lim[0]+'</td><td>'+lim[1]+'</td>';
    h += '<td>'+n+'</td>';
    h += '<td>'+fi(avgSal)+'</td>';
    h += '<td>'+fi(avgBase)+'</td>';
    h += '<td class="'+rateClass(rate)+'">'+rate.toFixed(0)+'%</td>';
    h += '<td onclick="event.stopPropagation()"><input class="ratio-input" type="number" min="0" max="100" value="'+(cityRatios[city]!==null?cityRatios[city]:100)+'" placeholder="100" onchange="setCityRatio(\''+city.replace(/'/g,"\\'")+'\''+',this.value)" onfocus="this.select()"></td>';
    h += '<td>'+fp(cur.per/n)+'</td>';
    h += '<td>'+fp((adj.per-cur.per)/n)+'</td>';
    h += '<td>'+fc(cur.com)+'</td>';
    h += '<td>'+fc(adj.com-cur.com)+'</td>';
    h += '<td style="color:#dc2626;font-weight:600">'+fc(adj.com)+'</td>';
    h += '</tr>';

    // Entity rows
    for (const ent of ents.sort()) {
      const eRecs = DATA[city][ent];
      const en = eRecs.length;
      const eAvgSal = eRecs.reduce((s,r)=>s+V(r.s),0)/en;
      const eAvgBase = eRecs.reduce((s,r)=>s+V(r.pb),0)/en;
      const eRate = eAvgSal>0 ? (eAvgBase/eAvgSal*100) : 0;
      const eCur = calcCost(eRecs, null, city);
      const eAdj = calcCost(eRecs, effPct, city);
      const eChg = (eAdj.per+eAdj.com) - (eCur.per+eCur.com);

      h += '<tr class="ent-row'+(isOpen?' show':'')+'" data-parent="'+i+'">';
      h += '<td></td>';
      h += '<td>'+ent.replace(/\([^)]*\)/g,'')+'</td>';
      h += '<td></td><td></td>';
      h += '<td>'+en+'</td>';
      h += '<td>'+fi(eAvgSal)+'</td>';
      h += '<td>'+fi(eAvgBase)+'</td>';
      h += '<td class="'+rateClass(eRate)+'">'+eRate.toFixed(0)+'%</td>';
      h += '<td></td>';
      h += '<td>'+fp(eCur.per/en)+'</td>';
      h += '<td>'+fp((eAdj.per-eCur.per)/en)+'</td>';
      h += '<td>'+fc(eCur.com)+'</td>';
      h += '<td>'+fc(eAdj.com-eCur.com)+'</td>';
      h += '<td style="color:#dc2626;font-weight:600">'+fc(eAdj.com)+'</td>';
      h += '</tr>';
    }
  }

  // Grand total
  const gChg = (grandNewPer+grandNewCom)-(grandCurPer+grandCurCom);
  h += '<tr class="total-row">';
  h += '<td></td><td>合计</td><td></td><td></td><td>'+grandN+'</td><td></td><td></td><td></td><td></td>';
  h += '<td>'+fp(grandCurPer/grandN)+'</td><td>'+fp((grandNewPer-grandCurPer)/grandN)+'</td>';
  h += '<td>'+fc(grandCurCom)+'</td><td>'+fc(grandNewCom-grandCurCom)+'</td>';
  h += '<td style="color:#dc2626;font-weight:700">'+fc(grandNewCom)+'</td>';
  h += '</tr>';

  tbody.innerHTML = h;

  // Summary cards
  const sc = document.getElementById('sumCards');
  sc.innerHTML = '<div class="sc" style="border-left-color:#3b82f6"><div class="sl">原成本（万元/年）</div><div class="sv" style="color:#1e40af">'+f(grandCurCom)+'</div></div>'
    + '<div class="sc" style="border-left-color:#f59e0b"><div class="sl">新增成本（万元/年）</div><div class="sv" style="color:#d97706">'+f(grandNewCom-grandCurCom)+'</div></div>'
    + '<div class="sc" style="border-left-color:#1e3a8a"><div class="sl">总成本（万元/年）</div><div class="sv" style="color:#1e3a8a">'+f(grandNewCom)+'</div></div>';
}

function toggleCity(city) {
  if (openCities.has(city)) openCities.delete(city);
  else openCities.add(city);
  render();
}

function setCityRatio(city, val) {
  const v = parseFloat(val);
  if (isNaN(v) || val === '') { cityRatios[city] = 100; }
  else { cityRatios[city] = Math.max(0, Math.min(100, v)); }
  render();
}

// Global slider removed - use per-city ratio input

render();
</script>
</body>
